# Repo-local Vale setup. Run `vale sync` to populate .vale/styles from the
# Packages below (the package dirs are gitignored; only this config and the
# gotmplfumpt vocabulary are tracked). Lint with `vale --no-global .` so only
# this config applies, independent of any user's global Vale config.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = proselint, alex, write-good, Readability, https://github.com/elastic/vale-rules/releases/latest/download/elastic-vale.zip
Vocab = gotmplfumpt

[*.md]
BasedOnStyles = Vale,Readability,alex,proselint,write-good,Elastic

[TODO.md]
# This is a to-do list, so "TODO" in the title is intentional.
proselint.Annotations = NO

[*.go]
BasedOnStyles = alex,proselint,write-good,Elastic
# In Go-doc context, "simple expression"/"simple number" come from the
# template/Go grammar's own terminology (text/template/parse), not from
# prose targeted at humans — alex.Condescending false-positives here.
alex.Condescending = NO
# {{ ... }} is the literal Go-template action syntax; the rule wants
# the typographic ellipsis "…" which would change the meaning.
proselint.Typography = NO
